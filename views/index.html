<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the Library</title>
  <style>
    :root {
      --bg-start: #fdfbf7;
      --bg-end: #e8e0d5;
      --card-bg: rgba(255, 255, 255, 0.75);
      --text: #2c241b;
      --muted: #6b5e4f;
      --accent: #b45309;
      --accent-hover: #92400e;
      --shadow: 0 20px 40px -12px rgba(44, 36, 27, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    }

    .hero {
      width: min(100%, 42rem);
    }

    .card {
      padding: clamp(2rem, 8vw, 4rem);
      text-align: center;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeUp 0.8s ease-out both;
    }

    .icon {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.5rem;
      animation: float 4s ease-in-out infinite;
    }

    .icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-bottom: 0.75rem;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
        Palatino, Georgia, serif;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 30ch;
      margin: 0 auto 2rem;
      font-size: clamp(1rem, 3vw, 1.125rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .button {
      display: inline-block;
      padding: 0.875rem 2rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: var(--accent);
      border-radius: 999px;
      box-shadow: 0 8px 20px -8px var(--accent);
      transition: background 0.2s ease, transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px var(--accent-hover);
      outline: none;
    }

    .button:focus-visible {
      box-shadow: 0 0 0 3px var(--bg-start), 0 0 0 6px var(--accent);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .icon {
        animation: none;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bookGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#b45309" />
              <stop offset="1" stop-color="#d97706" />
            </linearGradient>
          </defs>
          <path
            d="M32 12C24 6 14 6 8 8V52C14 50 24 50 32 56C40 50 50 50 56 52V8C50 6 40 6 32 12Z"
            stroke="url(#bookGradient)"
            stroke-width="3"
            stroke-linejoin="round"
            fill="rgba(180, 83, 9, 0.08)"
          />
          <path d="M32 12V56" stroke="url(#bookGradient)" stroke-width="3" stroke-linecap="round" />
          <path d="M14 20H26" stroke="url(#bookGradient)" stroke-width="2.5" stroke-linecap="round" />
          <path d="M14 28H26" stroke="url(#bookGradient)" stroke-width="2.5" stroke-linecap="round" />
          <path d="M38 20H50" stroke="url(#bookGradient)" stroke-width="2.5" stroke-linecap="round" />
          <path d="M38 28H50" stroke="url(#bookGradient)" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </div>

      <h1>Welcome to the Library</h1>
      <p>
        Discover new worlds, borrow your favorites, and let every page turn
        into an adventure.
      </p>
      <a class="button" href="#">Browse the Collection</a>
    </div>
  </main>
</body>
</html>
